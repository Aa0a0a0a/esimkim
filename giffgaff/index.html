<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>文章详情</title>
  <link id="favicon" rel="icon" href="">
  <script>
    (function () {
      var t = Date.now();
      var head = document.head;
      function css(href) { var l = document.createElement('link'); l.rel = 'stylesheet'; l.href = href + '?t=' + t; head.appendChild(l); }
      function js(src, cb) { var s = document.createElement('script'); s.src = src + '?t=' + t; s.onload = cb || null; head.appendChild(s); }
      css('/css/style.css');
      js('/assets/vendor/marked.min.js', function () {
        js('/js/api.js', function () { js('/js/article.js'); });
      });
    })();
  </script>
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <a class="brand" href="/"><span class="logo"><img id="logo-img" alt=""><span id="logo-fallback">e</span></span><span class="site-name"></span></a>
      <a id="header-btn" class="header-btn" target="_blank" rel="noopener noreferrer" style="display:none"></a>
    </div>
  </header>
  <main class="container article-page">
    <article class="article-main">
      <h1 id="title" class="article-title">加载中...</h1>
      <div id="meta" class="meta"></div>
      <div id="content" class="content"></div>
      <div id="source" class="source-card"></div>
    </article>
    <div id="article-ad" class="ad-wrap article-bottom-ad"></div>
  </main>
  <footer class="footer" id="footer-text"></footer>
</body>
</html>
