<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eSIM Kim</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: #333;
        }
        
        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 2rem 0;
            text-align: center;
        }
        
        header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }
        
        header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        
        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 3rem 1rem;
        }
        
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            margin-bottom: 3rem;
        }
        
        .card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 2rem;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.15);
        }
        
        .card h2 {
            color: #667eea;
            margin-bottom: 1rem;
            font-size: 1.5rem;
        }
        
        .card p {
            color: #666;
            line-height: 1.8;
        }
        
        footer {
            background: #f8f9fa;
            text-align: center;
            padding: 2rem;
            margin-top: 3rem;
            color: #666;
            border-top: 1px solid #eee;
        }
    </style>
</head>
<body>
    <header>
        <h1>eSIM Kim</h1>
        <p>您的全球连接解决方案</p>
    </header>
    
    <main>
        <div class="container">
            <div class="card">
                <h2>🌍 全球覆盖</h2>
                <p>连接全球 200+ 个国家和地区，享受无缝的国际通信体验。</p>
            </div>
            
            <div class="card">
                <h2>⚡ 高速网络</h2>
                <p>支持 4G/5G 网络，提供超快的数据传输速度。</p>
            </div>
            
            <div class="card">
                <h2>💰 经济实惠</h2>
                <p>透明的价格体系，没有隐藏费用，节省您的通信成本。</p>
            </div>
            
            <div class="card">
                <h2>🔒 安全可靠</h2>
                <p>企业级加密和安全保护，保护您的数据隐私。</p>
            </div>
            
            <div class="card">
                <h2>📱 即时激活</h2>
                <p>无需更换 SIM 卡，在线即时激活您的 eSIM。</p>
            </div>
            
            <div class="card">
                <h2>🆘 24/7 支持</h2>
                <p>随时随地获得专业的客服支持和技术帮助。</p>
            </div>
        </div>
    </main>
    
    <footer>
        <p>&copy; 2026 eSIM Kim. 保留所有权利。</p>
    </footer>
</body>
</html>
